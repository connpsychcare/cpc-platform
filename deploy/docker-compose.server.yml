services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: connected-psychiatric-care-server:latest
    container_name: connected-psychiatric-care-server
    restart: unless-stopped
    env_file:
      - ./server/.env.prod
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
